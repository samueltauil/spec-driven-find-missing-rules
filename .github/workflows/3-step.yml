name: Step 3 # Last step of the exercise

on:
  # Manual re-run for facilitators and testing.
  workflow_dispatch:
  # The learner opens a pull request; every later push to it is checked again.
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

# Least privilege: no default permissions; each job asks only for what it uses.
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  REVIEW_FILE: ".github/steps/x-review.md"

jobs:
  find_exercise:
    name: Find Exercise Issue
    permissions:
      issues: read # locate the exercise issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3

  check_step_work:
    name: Check step work
    runs-on: ubuntu-latest
    needs: [find_exercise]
    permissions:
      contents: read # read the learner's files
      issues: write # update Mona's feedback comment
      # No actions: write. A learner-triggered job must not enable or disable workflows.
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-author: github-actions[bot] # never target the learner's own comment
          direction: last

      - name: Update comment - checking work
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install the OpenSpec CLI
        run: npm ci --ignore-scripts --no-audit --no-fund

      # START: Check practical exercise

      - name: Check all eight gap rows have a Caught by value
        id: check-gap-rows
        continue-on-error: true
        run: |
          f=retro/gap-comparison.md
          [ -f "$f" ] || { echo "$f is missing"; exit 1; }
          # A row is | # | Gap | Week found | Move | Caught by |; the leading pipe is optional.
          filled=$(tr -d '\r' < "$f" | awk -F'|' '
            { o = ($1 ~ /^[ \t]*$/) ? 1 : 0; n = $(1 + o); gsub(/[ \t]/, "", n) }
            n ~ /^[1-8]$/ { v = $(5 + o); gsub(/^[ \t]+|[ \t]+$/, "", v); if (v != "" && v !~ /^-+$/) print n }
          ' | sort -u | tr '\n' ' ')
          echo "Rows with a Caught by value: ${filled:-none}"
          [ "$(echo "$filled" | wc -w)" -eq 8 ]

      - name: Check the added requirement exists in the spec delta
        id: check-added-requirement
        continue-on-error: true
        run: |
          f=retro/gap-comparison.md
          [ -f "$f" ] || { echo "$f is missing"; exit 1; }
          label() { tr -d '\r' < "$f" | awk 'tolower($0) ~ /^## +added after the retro/ {f = 1; next} /^## / {f = 0} f' | grep -i -- "$1:" | head -n 1 | sed -E 's/^[^:]*:[*_]*[[:space:]]*//; s/[[:space:]]+$//'; }
          gap=$(label "Gap number" | grep -oE '[0-9]+' | head -n 1 || true)
          req=$(label "Requirement" | sed -E 's/^#+[[:space:]]*Requirement:[[:space:]]*//I; s/[`"]//g; s/^[*_[:space:]]+|[*_[:space:]]+$//g')
          echo "Gap number: ${gap:-none}"
          echo "Requirement: ${req:-none}"
          [ -n "$gap" ] && [ "$gap" -ge 1 ] && [ "$gap" -le 8 ] || { echo "The gap number must be from 1 to 8"; exit 1; }
          [ -n "$req" ] || { echo "No requirement name found"; exit 1; }
          found=$(cat openspec/changes/add-vision-rider/specs/*/spec.md 2>/dev/null | tr -d '\r' | REQ="$req" awk '
            BEGIN { r = tolower(ENVIRON["REQ"]) }
            /^###[ \t]+Requirement:/ { n = $0; sub(/^###[ \t]+Requirement:[ \t]*/, "", n); sub(/[ \t]+$/, "", n); if (tolower(n) == r) c++ }
            END { print c + 0 }' || true)
          [ "${found:-0}" -ge 1 ] || { echo "No ### Requirement: $req in the add-vision-rider spec delta"; exit 1; }

      - name: Check the change passes strict validation
        id: check-validate
        continue-on-error: true
        env:
          OPENSPEC_TELEMETRY: 0
        run: |
          [ -d openspec/changes/add-vision-rider ] || { echo "openspec/changes/add-vision-rider is missing"; exit 1; }
          npx --no -- openspec validate add-vision-rider --type change --strict --no-interactive

      - name: Update comment - step results
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          # Tips render only when a check failed. Keep tip text free of single quotes.
          vars: |
            step_number: 3
            results_table:
              - description: "retro/gap-comparison.md has all eight gap rows, each with a Caught by value"
                passed: ${{ steps.check-gap-rows.outcome == 'success' }}
              - description: "The Added after the retro section names a gap number and a requirement that exists in the spec delta"
                passed: ${{ steps.check-added-requirement.outcome == 'success' }}
              - description: "The add-vision-rider change passes openspec validate --strict"
                passed: ${{ steps.check-validate.outcome == 'success' }}
            tips: ${{ contains(steps.*.outcome, 'failure') && '["Fill the Caught by cell of every row from 1 to 8. If nothing catches a gap, write Missed.", "Under ## Added after the retro, replace both placeholders, and copy the requirement name exactly as it appears after ### Requirement: in the spec delta.", "Run npx openspec validate add-vision-rider --strict and fix every error.", "Commit and push to vision-retro again. Mona checks the pull request on every push."]' || '[]' }}

      # END: Check practical exercise

      - name: Fail job if not all checks passed
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_review_content:
    name: Post review content
    needs: [find_exercise, check_step_work] # grading must gate the review
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout review content
      actions: write # disable this final workflow
      issues: write # post the review comments
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Create comment - step finished - final review next
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/lesson-review.md

      - name: Create comment - add review content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.REVIEW_FILE }}
          vars: |
            login: ${{ github.actor }}
            full_repo_name: ${{ github.repository }}

      - name: Disable current workflow
        run: gh workflow disable "${{ github.workflow }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finish_exercise:
    name: Finish Exercise
    needs: [find_exercise, post_review_content]
    permissions:
      contents: write # the toolkit commits the congratulations README
      issues: write # the toolkit comments on and closes the exercise issue
    uses: skills/exercise-toolkit/.github/workflows/finish-exercise.yml@v0.9.3
    with:
      issue-url: ${{ needs.find_exercise.outputs.issue-url }}
      exercise-title: "Find the Missing Rules Before You Build"
