name: Step 2

on:
  # Manual re-run for facilitators and testing.
  workflow_dispatch:
  # The learner pushes the change to the same branch; only the enabled step workflow runs.
  push:
    branches:
      - vision-retro
    paths:
      - openspec/changes/**

# Least privilege: no default permissions; each job asks only for what it uses.
permissions: {}

# A quick second push cancels the run it supersedes instead of grading twice.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  STEP_3_FILE: ".github/steps/3-step.md"

jobs:
  find_exercise:
    name: Find Exercise Issue
    permissions:
      issues: read # locate the exercise issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3

  check_step_work:
    name: Check step work
    runs-on: ubuntu-latest
    needs: [find_exercise]
    permissions:
      contents: read # read the learner's files
      issues: write # update Mona's feedback comment
      # No actions: write. A learner-triggered job must not enable or disable workflows.
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-author: github-actions[bot] # never target the learner's own comment
          direction: last

      - name: Update comment - checking work
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install the OpenSpec CLI
        run: npm ci --ignore-scripts --no-audit --no-fund

      # START: Check practical exercise
      # The change name is fixed: openspec/changes/add-vision-rider.

      - name: Check the proposal has a Why and a What Changes section
        id: check-proposal
        continue-on-error: true
        run: |
          f=openspec/changes/add-vision-rider/proposal.md
          [ -f "$f" ] || { echo "$f is missing"; exit 1; }
          # The outline's guidance is in HTML comments, so drop them before looking for text.
          body=$(tr -d '\r' < "$f" | perl -0777 -pe 's/<!--.*?-->//gs')
          section() { printf '%s\n' "$body" | awk -v h="$1" 'tolower($0) ~ ("^## +" h "[ \t]*$") {f = 1; next} /^## / {f = 0} f' | grep -cE '[A-Za-z]' || true; }
          why=$(section "why")
          changes=$(section "what changes")
          echo "Lines of text under Why: $why, under What Changes: $changes"
          [ "$why" -ge 1 ] && [ "$changes" -ge 1 ]

      - name: Check the spec delta has at least three requirements
        id: check-requirements
        continue-on-error: true
        run: |
          ls openspec/changes/add-vision-rider/specs/*/spec.md 2>/dev/null || echo "No spec delta found under openspec/changes/add-vision-rider/specs"
          count=$(cat openspec/changes/add-vision-rider/specs/*/spec.md 2>/dev/null | tr -d '\r' | grep -cE '^### +Requirement:' || true)
          echo "Requirements: ${count:-0}"
          [ "${count:-0}" -ge 3 ]

      - name: Check the change passes strict validation
        id: check-validate
        continue-on-error: true
        env:
          OPENSPEC_TELEMETRY: 0
        run: |
          [ -d openspec/changes/add-vision-rider ] || { echo "openspec/changes/add-vision-rider is missing"; exit 1; }
          npx --no -- openspec validate add-vision-rider --type change --strict --no-interactive

      - name: Update comment - step results
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          # Tips render only when a check failed. Keep tip text free of single quotes.
          vars: |
            step_number: 2
            results_table:
              - description: "openspec/changes/add-vision-rider/proposal.md has your own text under ## Why and ## What Changes"
                passed: ${{ steps.check-proposal.outcome == 'success' }}
              - description: "The spec delta has at least three ### Requirement: headings"
                passed: ${{ steps.check-requirements.outcome == 'success' }}
              - description: "The add-vision-rider change passes openspec validate --strict"
                passed: ${{ steps.check-validate.outcome == 'success' }}
            tips: ${{ contains(steps.*.outcome, 'failure') && '["Name the folder openspec/changes/add-vision-rider, and replace each comment in proposal.md with your own words.", "Keep at least three requirements in specs/vision-rider/spec.md under ## ADDED Requirements. Each one needs its own line that starts with ### Requirement: (text copied from chat can lose its # characters).", "Run npx openspec validate add-vision-rider --strict in the terminal and fix every error. Each requirement needs MUST or SHALL in capitals and a #### Scenario: with GIVEN, WHEN and THEN.", "Commit and push to vision-retro again."]' || '[]' }}

      # END: Check practical exercise

      - name: Fail job if not all checks passed
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_next_step_content:
    name: Post next step content
    needs: [find_exercise, check_step_work] # grading must gate progress
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout step content
      actions: write # disable this step and enable the next one
      issues: write # post step content and progress comments
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Create comment - step finished
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 3

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_3_FILE }}
          vars: |
            login: ${{ github.actor }}
            full_repo_name: ${{ github.repository }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Disable current workflow and enable next one
        run: |
          gh workflow disable "${{ github.workflow }}"
          gh workflow enable "Step 3"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
